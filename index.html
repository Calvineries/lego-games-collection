    <script>
      function saveCheckboxState() {
          const checkboxes = document.querySelectorAll('.checkbox, .checkbox2');
          checkboxes.forEach((checkbox, index) => {
              localStorage.setItem(`checkbox${index + 1}`, checkbox.checked);
          });
      }

      function loadCheckboxState() {
          const checkboxes = document.querySelectorAll('.checkbox, .checkbox2');
          checkboxes.forEach((checkbox, index) => {
              const checked = localStorage.getItem(`checkbox${index + 1}`) === 'true';
              checkbox.checked = checked;
          });
      }

      document.addEventListener('DOMContentLoaded', loadCheckboxState);

      const checkboxes = document.querySelectorAll('.checkbox, .checkbox2');
      checkboxes.forEach(checkbox => {
          checkbox.addEventListener('change', saveCheckboxState);
      });

      const showFirstCheckboxRadio = document.getElementById('showFirstCheckboxRadio');
      const showBothCheckboxesRadio = document.getElementById('showBothCheckboxesRadio');
      const checkboxElements = document.querySelectorAll('.checkbox');
      const checkbox2Elements = document.querySelectorAll('.checkbox2');

      function updateCheckboxVisibility() {
          if (showFirstCheckboxRadio.checked) {
              checkboxElements.forEach(checkbox => {
                  checkbox.style.display = 'block';
              });
              checkbox2Elements.forEach(checkbox => {
                  checkbox.style.display = 'none';
              });
          } else if (showBothCheckboxesRadio.checked) {
              checkboxElements.forEach(checkbox => {
                  checkbox.style.display = 'block';
              });
              checkbox2Elements.forEach(checkbox => {
                  checkbox.style.display = 'block';
              });
          }
      }

      function saveRadioState() {
          const selectedRadio = document.querySelector('input[name="showCheckbox"]:checked').value;
          localStorage.setItem('selectedRadio', selectedRadio);
      }

      function loadRadioState() {
          const savedRadio = localStorage.getItem('selectedRadio');

          if (!savedRadio) {
              showFirstCheckboxRadio.checked = true;
          } else if (savedRadio === 'first') {
              showFirstCheckboxRadio.checked = true;
          } else if (savedRadio === 'both') {
              showBothCheckboxesRadio.checked = true;
          }
          updateCheckboxVisibility();
      }

      showFirstCheckboxRadio.addEventListener('change', () => {
          updateCheckboxVisibility();
          saveRadioState();
      });
      showBothCheckboxesRadio.addEventListener('change', () => {
          updateCheckboxVisibility();
          saveRadioState();
      });

      document.addEventListener('DOMContentLoaded', loadRadioState);
  </script>
